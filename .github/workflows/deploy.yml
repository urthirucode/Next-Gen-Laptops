name: Deploy NextGen Laptops to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps || (
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              for (const section of ["dependencies", "devDependencies"]) {
                if (!pkg[section]) continue;
                for (const key of Object.keys(pkg[section])) {
                  pkg[section][key] = "latest";
                }
              }
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            ' && npm install --legacy-peer-deps
          )

      - name: Build production bundle with Vite
        env:
          # Uses GitHub Pages configured base_path if available, otherwise defaults to /<repo-name>/
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path != '' && format('{0}/', steps.pages.outputs.base_path) || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Add SPA fallback (404.html) and .nojekyll for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
