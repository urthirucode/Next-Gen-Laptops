name: Deploy NextGen Laptops to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize package.json for public npm registry and install
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies = {
              "lucide-react": "^0.475.0",
              "react": "^19.0.0",
              "react-dom": "^19.0.0",
              "react-router-dom": "^7.1.5"
            };
            pkg.devDependencies = {
              "@tailwindcss/vite": "^4.0.9",
              "@types/node": "^22.10.0",
              "@types/react": "^19.0.0",
              "@types/react-dom": "^19.0.0",
              "@vitejs/plugin-react": "^4.3.4",
              "tailwindcss": "^4.0.9",
              "typescript": "~5.7.2",
              "vite": "^6.2.0"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm install --no-audit --no-fund

      - name: Build production bundle
        env:
          VITE_BASE_PATH: "./"
        run: npm run build

      - name: Prepare SPA routing fallback (404.html) and .nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Check if GitHub Pages Actions mode is enabled
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact (if Actions source enabled)
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages (if Actions source enabled)
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
